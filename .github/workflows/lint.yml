name: 🐍 Code Quality (Linter)

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: 📥 Repoyu Klonla
      uses: actions/checkout@v4

    - name: 🐍 Python Kur
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ⚡ Ruff Linter Kur
      run: |
        python -m pip install --upgrade pip
        pip install ruff

    - name: 🔍 Ruff ile Kodu Denetle
      run: |
        # Hataları ve uyarıları göster. Ruff otomatik olarak ayarlanır.
        ruff check .
